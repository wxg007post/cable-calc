<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>弱电智能化 · 常用线缆穿管 / 桥架规格计算器</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --line: #e3e8ef;
    --text: #1f2933;
    --muted: #6b7785;
    --brand: #2563eb;
    --brand-soft: #e8f0fe;
    --warn: #b42318;
    --ok: #15803d;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header.page-head {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border-radius: 14px;
    padding: 22px 26px;
    box-shadow: var(--shadow);
  }
  header.page-head h1 { margin: 0 0 6px; font-size: 22px; text-align: center; }
  header.page-head .src { font-size: 13px; opacity: .9; text-align: center; }
  .tabs { display: flex; gap: 0; margin-top: 18px; }
  .tab {
    flex: 1; padding: 14px 20px; font-size: 16px; font-weight: 700;
    border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: pointer;
    font-family: inherit; transition: background .15s, color .15s;
  }
  .tab:first-child { border-radius: 12px 0 0 12px; }
  .tab:last-child { border-radius: 0 12px 12px 0; border-left: none; }
  .tab.active { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; border-color: transparent; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    margin-top: 18px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 16px; margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .tag {
    font-size: 12px; font-weight: 400; color: var(--brand);
    background: var(--brand-soft); padding: 2px 8px; border-radius: 6px;
  }
  .basis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .basis-item { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; background: #fafbfc; }
  .basis-item .t { font-weight: 600; margin-bottom: 4px; }
  .basis-item .d { font-size: 13px; color: var(--muted); }
  .basis-item .v { color: var(--warn); font-weight: 700; }
  .controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .controls label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  select, input[type=number], input[type=text] {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; background: #fff; color: var(--text); font-family: inherit;
  }
  select:focus, input:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .table-scroll {
    max-height: 460px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; table-layout: fixed; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: center; overflow: hidden; }
  th { background: #f1f5f9; color: var(--muted); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
  td input, td select { width: 100%; }
  .row-result { font-weight: 600; color: var(--brand); }
  .row-result.warn { color: var(--warn); }
  .add-row-tr { background: #f0f6ff; }
  .add-row-tr td { border-bottom: 1px solid var(--line); }
  .btn {
    border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px;
    cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: #eef2f7; color: var(--text); }
  .btn-ghost:hover { background: #e2e8f0; }
  .btn-sm { padding: 5px 10px; font-size: 12px; border: none; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: #fafbfc; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .val { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .stat .val.warn { color: var(--warn); }
  .stat .val.ok { color: var(--ok); }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .pager { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pager button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-family: inherit; font-size: 13px; }
  .pager button:hover:not(:disabled) { background: #eef2f7; }
  .pager button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .pg-info { color: var(--brand); font-size: 13px; margin: 0 6px; font-weight: 700; }
  .page-size-ctl { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .page-size-ctl button {
    border: none; background: #eef2f7; color: var(--text); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
  }
  .page-size-ctl button:hover { background: #e2e8f0; }
  .page-size-ctl button.active { background: var(--brand); color: #fff; }
  .pipe-field { display: flex; align-items: center; gap: 10px; }
  .pipe-label { font-weight: 700; font-size: 15px; color: var(--text); padding: 7px 2px; }
</style>
</head>

<div class="wrap">
  <header class="page-head">
    <h1>弱电智能化 · 常用线缆穿管 / 桥架规格计算器</h1>
    <div class="src">计算依据《民用建筑电气设计标准》GB 51348-2019 · 图集 19DX101-1</div>

  </header>

  <div class="card">

    </div>

        <button data-size="30">30</button>
        <button data-size="50">50</button>

    <div class="table-scroll">

            <th style="width:64px">操作</th>
          </tr>
        </thead>
        <tbody id="cableBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <div class="card">
    <h2>📊 汇总计算结果</h2>

    </div>
    <p class="note" id="msg"></p>
  </div>
</div>

/* ---------- 逻辑 ---------- */
function areaOf(od){ return (od/2)*(od/2)*Math.PI; }
/* 线缆截面积：扁形/矩形截面用显式 area，其余按圆形公式 */
function cableArea(item){ return (item.area != null) ? item.area : areaOf(item.od); }
function fmt(n){ return (Math.round(n*100)/100).toLocaleString('zh-CN'); }

/* 向上匹配：在已排序升序的 key 列表中找到第一个 >= value 的项 */
function lookupGE(arr, keyFn, value){
  for(const it of arr){ if(keyFn(it) >= value) return it; }
  return null;
}

/* 单根管径计算：输入外径od、截面积area、根数qty、管材数组、计算模式mode */
function pipeFor(od, area, qty, pipes, mode){
  if((od == null && area == null) || qty <= 0) return {label:"-", area:null};
  if(mode.singleBranch && qty === 1){
    const hit = lookupGE(pipes, p => p.d, od / mode.ratioSingle);
    if(!hit) return {label:"建议桥架敷设", area:null};
    return {label:hit.label, area:hit.a};
  }
  const hit = lookupGE(pipes, p => p.a, area * qty / mode.ratioMulti);
  if(!hit) return {label:"建议桥架敷设", area:null};
  return {label:hit.label, area:hit.a};
}

/* 线缆型号单元格：自定义类别显示文本输入，其余显示该类别下拉 */
function buildModelCell(cat, name, onSelect, onNameInput){
  const td = document.createElement('td');
  if(cat === "自定义"){
    const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = '线缆型号（自定）'; inp.value = name || '';
    inp.oninput = e => onNameInput(e.target.value);
    td.appendChild(inp);
  } else {
    const sel = document.createElement('select');
    const list = cur().db.filter(c => c.cat === cat);
    list.forEach(c => {
      const o = document.createElement('option');
      o.value = c.name; o.textContent = c.name;
      if(c.name === name) o.selected = true;
      sel.appendChild(o);
    });
    if(name && !list.some(c => c.name === name)){
      const o = document.createElement('option'); o.value = name; o.textContent = name + ' (自定义外径)'; o.selected = true; sel.appendChild(o);
    }
    sel.onchange = e => {
      const c = cur().db.find(x => x.cat === cat && x.name === e.target.value);
      onSelect(c ? c.name : e.target.value, c ? c.od : null, c && c.area != null ? c.area : null, c ? c.odText : null);
    };
    td.appendChild(sel);
  }
  return td;
}

/* 外径单元格：有 odText 显示束径文本（只读），否则显示可编辑数值输入 */
function buildOdCell(item){
  const td = document.createElement('td');
  if(item.odText){ td.textContent = item.odText; return td; }
  const inp = document.createElement('input');
  inp.type = 'number'; inp.step = '0.1'; inp.placeholder = '外径';
  inp.value = (item.od == null ? '' : item.od);
  td.appendChild(inp);
  return td;
}

/* 已知类别且未选型号时，默认取该类别第一个线缆（自动带出外径与截面积） */
function defaultModelOf(state){
  if(state.cat !== "自定义" && !state.name){
    const first = cur().db.find(c => c.cat === state.cat);
    if(first){ state.name = first.name; state.od = first.od; state.area = (first.area != null) ? first.area : null; state.odText = first.odText || null; }
  }
}

/* 提交空白添加行 */
function commitAdd(){
  const st = cur().addState;
  if(!st.name || (st.od == null && st.area == null)){ alert('请在添加行填写线缆型号与有效外径（自定义类别需手填外径）'); return; }
  cur().rows.push({cat: st.cat, name: st.name, od: st.od, area: (st.area != null) ? st.area : null, qty: st.qty || 1});
  cur().addState = {cat: curCats()[0], name:"", od:null, area:null, qty:1};
  cur().currentPage = Math.max(1, Math.ceil(cur().rows.length / cur().pageSize));
  render();
}

function render(){
  const t = cur();
  const mode = t;
  const pipes = PIPES[pipeSel.value];
  const body = document.getElementById('cableBody');
  body.innerHTML = '';
  const total = Math.max(1, Math.ceil(t.rows.length / t.pageSize));
  if(t.currentPage > total) t.currentPage = total;
  const start = (t.currentPage - 1) * t.pageSize;
  const pageRows = t.rows.slice(start, start + t.pageSize);

  pageRows.forEach((r, idx) => {
    const gi = start + idx;
    const tr = document.createElement('tr');

    const tdCat = document.createElement('td');
    const catSel = document.createElement('select');
    curCats().forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; if(c === r.cat) o.selected = true; catSel.appendChild(o); });
    catSel.onchange = e => { r.cat = e.target.value; r.name = ''; r.od = null; r.area = null; r.odText = null; render(); };
    tdCat.appendChild(catSel);

    defaultModelOf(r);
    const tdModel = buildModelCell(r.cat, r.name,
      (name, od, area, odText) => { r.name = name; r.od = od; r.area = area; r.odText = odText || null; render(); },
      (v) => { r.name = v; }
    );

    const tdOd = buildOdCell(r);
    const odInp = tdOd.querySelector('input');

    const tdArea = document.createElement('td');
    tdArea.textContent = (r.od || r.area != null) ? fmt(cableArea(r)) : '-';

    const tdQty = document.createElement('td');
    const qInp = document.createElement('input'); qInp.type = 'number'; qInp.step = '1'; qInp.min = '0'; qInp.value = r.qty; qInp.style.width = '64px';
    tdQty.appendChild(qInp);

    const tdRes = document.createElement('td'); tdRes.className = 'row-result';
    const a0 = cableArea(r);
    const pr0 = pipeFor(r.od, a0, r.qty, pipes, mode); tdRes.textContent = pr0.label;

    const tdOp = document.createElement('td');
    const del = document.createElement('button'); del.className = 'btn btn-ghost btn-sm'; del.textContent = '删除';
    del.onclick = () => {
      cur().rows.splice(gi, 1);
      const tt = Math.max(1, Math.ceil(cur().rows.length / cur().pageSize));
      if(cur().currentPage > tt) cur().currentPage = tt;
      render();
    };
    tdOp.appendChild(del);

    if(odInp){
      odInp.oninput = e => {
        r.od = parseFloat(e.target.value) || null; r.area = null;
        tdArea.textContent = (r.od || r.area != null) ? fmt(cableArea(r)) : '-';
        const p = pipeFor(r.od, cableArea(r), r.qty, pipes, mode);

        renderSummary();
      };
    }
    qInp.oninput = e => {
      r.qty = parseInt(e.target.value) || 0;
      const p = pipeFor(r.od, cableArea(r), r.qty, pipes, mode);
      tdRes.textContent = p.label; tdRes.classList.toggle('warn', p.label === '建议桥架敷设');
      renderSummary();
    };

    tr.append(tdCat, tdModel, tdOd, tdArea, tdQty, tdRes, tdOp);
    body.appendChild(tr);
  });

  /* 最后一页始终追加一行空白"添加行" */
  if(t.currentPage === total){
    ensureAddState(activeTab);
    const st = cur().addState;
    const tr = document.createElement('tr'); tr.className = 'add-row-tr';
    const tdCat = document.createElement('td');
    const catSel = document.createElement('select');
    curCats().forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; if(c === st.cat) o.selected = true; catSel.appendChild(o); });
    catSel.onchange = e => { st.cat = e.target.value; st.name = ''; st.od = null; st.area = null; st.odText = null; render(); };
    tdCat.appendChild(catSel);

    defaultModelOf(st);
    const tdModel = buildModelCell(st.cat, st.name,
      (name, od, area, odText) => { st.name = name; st.od = od; st.area = area; st.odText = odText || null; render(); },
      (v) => { st.name = v; }
    );

    const tdOd = buildOdCell(st);
    const odInp = tdOd.querySelector('input');

    const tdArea = document.createElement('td');
    tdArea.textContent = (st.od || st.area != null) ? fmt(cableArea(st)) : '-';

    const tdQty = document.createElement('td');

    const tdOp = document.createElement('td');
    const addBtn = document.createElement('button'); addBtn.className = 'btn btn-primary btn-sm'; addBtn.textContent = '添加';

  renderSummary();

  document.querySelectorAll('.page-size-ctl button').forEach(x => x.classList.toggle('active', parseInt(x.dataset.size) === t.pageSize));
}

function renderSummary(){
  const t = cur(), mode = t;
  const pipes = PIPES[pipeSel.value];
  let totalQty = 0, totalArea = 0;
  t.rows.forEach(r => {
    if((r.od || r.area != null) && r.qty > 0){ totalQty += r.qty; totalArea += cableArea(r) * r.qty; }
  });
  document.getElementById('sumQty').textContent = totalQty;
  document.getElementById('sumArea').textContent = totalArea ? fmt(totalArea) : '0';

  let pipeLabel = '-', pipeArea = null;
  if(totalQty > 0){
    if(totalQty === 1){
      const only = t.rows.find(r => (r.od || r.area != null) && r.qty > 0);
      const pr = pipeFor(only.od, cableArea(only), 1, pipes, mode);
      pipeLabel = pr.label; pipeArea = pr.area;
    } else {
      const hit = lookupGE(pipes, p => p.a, totalArea / mode.ratioMulti);
      if(!hit){ pipeLabel = '建议桥架敷设'; }
      else { pipeLabel = hit.label; pipeArea = hit.a; }
    }
  }
  const pe = document.getElementById('suggestPipe'); pe.textContent = pipeLabel;
  pe.classList.toggle('warn', pipeLabel === '建议桥架敷设');
  document.getElementById('pipeArea').textContent = pipeArea != null ? fmt(pipeArea) : '-';

  let bridgeSpec = '-', bridgeArea = null;
  if(totalArea > 0){
    const hit = lookupGE(BRIDGES, b => b.a, totalArea / mode.ratioBridge);
    if(!hit){ bridgeSpec = '线缆过多，请手动选择桥架'; }
    else { bridgeSpec = hit.spec; bridgeArea = hit.a; }
  }
  const be = document.getElementById('suggestBridge'); be.textContent = bridgeSpec;
  be.classList.toggle('warn', bridgeSpec.indexOf('请手动') >= 0);
  document.getElementById('bridgeArea').textContent = bridgeArea != null ? fmt(bridgeArea) : '-';

  const msg = document.getElementById('msg');
  if(totalQty === 0) msg.textContent = '请在上方添加行选择 / 填写线缆后，自动计算建议管径与桥架规格。';
  else if(pipeLabel === '建议桥架敷设') msg.textContent = '当前管材最大规格仍无法满足利用率要求，建议桥架敷设。';
  else msg.textContent = '已按【' + pipeSel.value + '】计算。';
}

/* 分页 */
function pageNumbers(cur, total){
  if(total <= 7) return Array.from({length: total}, (_, i) => i + 1);
  const res = [1];
  if(cur > 3) res.push('...');
  for(let n = Math.max(2, cur - 1); n <= Math.min(total - 1, cur + 1); n++) res.push(n);
  if(cur < total - 2) res.push('...');
  res.push(total);
  return res;
}
function renderPager(){
  const t = cur();
  const pager = document.getElementById('pager');
  pager.innerHTML = '';
  const total = Math.max(1, Math.ceil(t.rows.length / t.pageSize));
  if(t.currentPage > total) t.currentPage = total;
  const mk = (label, page, opts) => {
    opts = opts || {};
    const b = document.createElement('button'); b.textContent = label;
    if(opts.active) b.classList.add('active');
    if(opts.disabled) b.disabled = true;
    else b.onclick = () => { t.currentPage = page; render(); };
    return b;
  };
  pager.appendChild(mk('« 首页', 1, {disabled: t.currentPage === 1}));
  pager.appendChild(mk('‹ 上一页', t.currentPage - 1, {disabled: t.currentPage === 1}));
  pageNumbers(t.currentPage, total).forEach(n => {
    if(n === '...'){ const s = document.createElement('span'); s.textContent = '…'; s.style.color = 'var(--muted)'; pager.appendChild(s); }
    else pager.appendChild(mk(String(n), n, {active: n === t.currentPage}));
  });
  pager.appendChild(mk('› 下一页', t.currentPage + 1, {disabled: t.currentPage === total}));
  pager.appendChild(mk('» 末页', total, {disabled: t.currentPage === total}));
  const info = document.createElement('span'); info.className = 'pg-info';
  info.textContent = '每页 ' + t.pageSize + ' 行 · 第 ' + t.currentPage + ' / ' + total + ' 页 · 共 ' + t.rows.length + ' 条线缆';
  pager.appendChild(info);
}

/* 计算依据卡片渲染 */
function renderBasis(){
  const grid = document.getElementById('basisGrid');
  grid.innerHTML = '';
  BASIS[activeTab].forEach(it => {
    const d = document.createElement('div'); d.className = 'basis-item';
    d.innerHTML = '<div class="t">' + it.t + '</div><div class="d">' + it.d + '</div><div>'
      + it.v.replace(/≤/, '≤ <span class="v">').replace(/%$/, '%</span>') + '</div>';
    grid.appendChild(d);
  });
}

/* 导出 Excel（纯前端，.xls） */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function exportExcel(){
  const t = cur(), mode = t;
  const pipes = PIPES[pipeSel.value];
  let totalQty = 0, totalArea = 0;
  t.rows.forEach(r => { if((r.od || r.area != null) && r.qty > 0){ totalQty += r.qty; totalArea += cableArea(r) * r.qty; } });
  let pipeLabel = '-', pipeArea = null;
  if(totalQty > 0){
    if(totalQty === 1){
      const only = t.rows.find(r => (r.od || r.area != null) && r.qty > 0);
      const pr = pipeFor(only.od, cableArea(only), 1, pipes, mode); pipeLabel = pr.label; pipeArea = pr.area;
    } else {
      const hit = lookupGE(pipes, p => p.a, totalArea / mode.ratioMulti);
      if(hit){ pipeLabel = hit.label; pipeArea = hit.a; } else pipeLabel = '建议桥架敷设';
    }
  }
  let bridgeSpec = '-', bridgeArea = null;
  if(totalArea > 0){
    const hit = lookupGE(BRIDGES, b => b.a, totalArea / mode.ratioBridge);
    if(hit){ bridgeSpec = hit.spec; bridgeArea = hit.a; } else bridgeSpec = '线缆过多，请手动选择桥架';
  }
  const basisLine = (activeTab === 'weak')
    ? '计算依据：GB 51348-2019（管径40% / 截面30% / 截面50%）'
    : '计算依据：GB 51348-2019（管径40% / 桥架40%）';
  const titleLine = (activeTab === 'weak') ? '弱电线缆 · 线缆穿管 / 桥架规格计算器' : '强电线缆 · 线缆穿管 / 桥架规格计算器';
  let html = '<table border="1" cellspacing="0">';
  html += '<tr><td colspan="6" style="font-weight:bold;font-size:14px">' + esc(titleLine) + '</td></tr>';
  html += '<tr><td colspan="6">管材类型：' + esc(pipeSel.value) + '</td></tr>';
  html += '<tr><td colspan="6">' + esc(basisLine) + '</td></tr>';
  html += '<tr><th>类别</th><th>线缆型号</th><th>外径(mm)</th><th>截面积(mm²)</th><th>根数</th><th>建议管径</th></tr>';
  t.rows.forEach(r => {
    const pr = pipeFor(r.od, cableArea(r), r.qty, pipes, mode);
    const odDisp = r.odText ? r.odText : (r.od || '');
    const areaDisp = (r.od || r.area != null) ? fmt(cableArea(r)) : '';
    html += '<tr><td>' + esc(r.cat) + '</td><td>' + esc(r.name) + '</td><td>' + esc(odDisp) + '</td><td>' + areaDisp + '</td><td>' + (r.qty || 0) + '</td><td>' + esc(pr.label) + '</td></tr>';
  });
  if(t.rows.length === 0) html += '<tr><td colspan="6">（未添加线缆）</td></tr>';
  html += '<tr><td colspan="6"></td></tr>';
  html += '<tr><td colspan="6" style="font-weight:bold">汇总结果</td></tr>';
  html += '<tr><td colspan="3">线缆总根数</td><td colspan="3">' + totalQty + '</td></tr>';
  html += '<tr><td colspan="3">线缆总截面积 (mm²)</td><td colspan="3">' + fmt(totalArea) + '</td></tr>';
  html += '<tr><td colspan="3">建议管径（汇总）</td><td colspan="3">' + esc(pipeLabel) + '</td></tr>';
  html += '<tr><td colspan="3">线管截面积 (mm²)</td><td colspan="3">' + (pipeArea != null ? fmt(pipeArea) : '-') + '</td></tr>';
  html += '<tr><td colspan="3">建议桥架规格</td><td colspan="3">' + esc(bridgeSpec) + '</td></tr>';
  html += '<tr><td colspan="3">桥架截面积 (mm²)</td><td colspan="3">' + (bridgeArea != null ? fmt(bridgeArea) : '-') + '</td></tr>';
  html += '</table>';
  const blob = new Blob(['\ufeff' + html], {type: 'application/vnd.ms-excel;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  const now = new Date();
  const ts = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '_' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
  a.download = (activeTab === 'weak' ? '弱电线缆计算_' : '强电线缆计算_') + ts + '.xls';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 切换标签页 */
function applyTab(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  ensureAddState(activeTab);
  pipeSel.value = cur().pipeType;
  renderBasis();
  render();
}
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => { activeTab = b.dataset.tab; applyTab(); };
});

/* 事件 */
document.getElementById('addBtn').onclick = commitAdd;
document.getElementById('resetBtn').onclick = () => {
  const t = cur();
  t.rows = []; t.currentPage = 1;
  t.addState = {cat: curCats()[0], name:"", od:null, area:null, qty:1};
  render();
};
document.getElementById('exportBtn').onclick = exportExcel;
pipeSel.onchange = () => { cur().pipeType = pipeSel.value; render(); };
document.querySelectorAll('.page-size-ctl button').forEach(b => {
  b.onclick = () => {
    cur().pageSize = parseInt(b.dataset.size); cur().currentPage = 1;
    render();
  };
});

/* 初始：渲染弱电线缆页 */
applyTab();
/* 初始高亮当前显示行数（随页切换由 render 控制，这里仅首次） */
document.querySelectorAll('.page-size-ctl button').forEach(x => x.classList.toggle('active', parseInt(x.dataset.size) === cur().pageSize));
</script>
